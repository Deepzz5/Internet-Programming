<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: lavender;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 5px rgba(79,70,229,0.3);
        }

        input[type="submit"] {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #3730a3;
        }

        .view-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            background: #e5e7eb;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .view-button:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Movie Booking</h1>

    <p class="subtitle">Book Your Movie Ticket</p>

<form action="insert_booking.php" method="POST">

        <label>Customer Name</label>
        <input
            type="text"
            name="customer_name"
            placeholder="Enter your name"
            required
        >

        <label>Movie Name</label>
        <select name="movie_name" required>
            <option value="">Select Movie</option>
            <option value="Coolie">Coolie</option>
            <option value="Leo">Leo</option>
            <option value="Vikram">Vikram</option>
            <option value="Dragon">Dragon</option>
            <option value="Retro">Retro</option>
        </select>

        <label>Show Date</label>
        <input
            type="date"
            name="show_date"
            required
        >

        <label>Show Time</label>
        <select name="show_time" required>
            <option value="">Select Show Time</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="1:30 PM">1:30 PM</option>
            <option value="4:30 PM">4:30 PM</option>
            <option value="7:30 PM">7:30 PM</option>
            <option value="10:30 PM">10:30 PM</option>
        </select>

        <label>Number of Tickets</label>
        <input
            type="number"
            name="tickets"
            min="1"
            max="10"
            placeholder="Enter number of tickets"
            required
        >

        <label>Ticket Price</label>
        <input
            type="number"
            name="price"
            step="0.01"
            min="0"
            placeholder="Enter ticket price"
            required
        >

        <input
            type="submit"
            value="Book Ticket"
        >

    </form>

    <a href="view_bookings.php" class="view-button">
        View All Bookings
    </a>

</div>

</body>
</html>
